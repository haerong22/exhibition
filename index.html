<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D Exhibition</title>
  <style>
    /* Theme tokens — dark default, light override via [data-theme="light"] */
    :root {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --bg-card-hover: #181818;
      --bg-input: #141414;
      --bg-tag: rgba(255,255,255,0.08);
      --border: #242424;
      --border-strong: #444;
      --border-input: #2a2a2a;
      --border-input-focus: #555;
      --text: #eee;
      --text-muted: #aaa;
      --text-faint: #666;
      --text-very-faint: #444;
      --picker-title: #888;
      --kbd-bg: #1f1f1f;
      --kbd-border: #333;
      --kbd-text: #fff;
      --divider: #1a1a1a;
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --bg-card: #ffffff;
      --bg-card-hover: #fafafa;
      --bg-input: #ffffff;
      --bg-tag: rgba(0,0,0,0.06);
      --border: #e2e2e2;
      --border-strong: #aaa;
      --border-input: #d8d8d8;
      --border-input-focus: #888;
      --text: #222;
      --text-muted: #555;
      --text-faint: #888;
      --text-very-faint: #aaa;
      --picker-title: #555;
      --kbd-bg: #f0f0f0;
      --kbd-border: #d0d0d0;
      --kbd-text: #222;
      --divider: #eaeaea;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; }

    /* Loading Screen */
    #loading-screen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text); transition: opacity 0.6s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-title { font-size: 2rem; font-weight: 300; letter-spacing: 0.3em; margin-bottom: 2rem; text-transform: uppercase; }
    #loading-bar-container { width: 300px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
    #loading-bar { width: 0%; height: 100%; background: var(--text); transition: width 0.3s ease; }
    #loading-status { margin-top: 1rem; font-size: 0.85rem; color: var(--text-faint); letter-spacing: 0.1em; }
    #loading-meta {
      display: none; margin-top: -1rem; margin-bottom: 1.4rem;
      font-size: 0.75rem; color: var(--text-faint); letter-spacing: 0.18em;
      text-transform: uppercase; font-weight: 300;
      opacity: 0; transition: opacity 0.5s ease;
    }
    #loading-meta.has-content { display: block; }
    #loading-meta.has-content.visible { opacity: 1; }
    #loading-meta .sep { color: var(--text-very-faint); margin: 0 0.5rem; }

    /* Enter Prompt */
    #enter-prompt {
      display: none; margin-top: 2rem; padding: 0.8rem 2.5rem;
      background: transparent; border: 1px solid var(--border-strong); color: var(--text);
      font-size: 1rem; letter-spacing: 0.15em; cursor: pointer;
      transition: all 0.3s ease; text-transform: uppercase;
    }
    #enter-prompt:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
    #enter-prompt.visible { display: block; }

    /* Curator note / exhibition description shown above enter button */
    #loading-description {
      display: none; max-width: 480px; margin-top: 2rem; padding: 0 1.5rem;
      font-size: 0.92rem; line-height: 1.75; color: var(--text-muted);
      letter-spacing: 0.02em; text-align: center;
      white-space: pre-line; font-weight: 300;
      opacity: 0; transition: opacity 0.6s ease;
    }
    #loading-description.has-content { display: block; }
    #loading-description.has-content.visible { opacity: 1; }
    #loading-description::before, #loading-description::after {
      content: ''; display: block; width: 32px; height: 1px;
      background: var(--border); margin: 0 auto;
    }
    #loading-description::before { margin-bottom: 1.2rem; }
    #loading-description::after { margin-top: 1.2rem; }
    /* Exhibition byline: 작가 / 큐레이터 */
    #loading-credits {
      display: none; margin-top: 0.6rem;
      font-size: 0.75rem; color: var(--text-faint); letter-spacing: 0.08em;
      text-align: center; font-weight: 300;
      opacity: 0; transition: opacity 0.6s ease;
    }
    #loading-credits.has-content { display: block; }
    #loading-credits.has-content.visible { opacity: 1; }
    #loading-credits .sep { color: var(--text-very-faint); margin: 0 0.5rem; }

    /* Loading screen — single horizontal strip pinned to bottom */
    #loading-controls {
      position: absolute; left: 0; right: 0; bottom: 2.5rem;
      opacity: 0; transition: opacity 0.6s ease;
      pointer-events: none;
    }
    #loading-controls.visible { opacity: 1; }
    #loading-controls ul {
      list-style: none; padding: 0; margin: 0;
      display: flex; flex-wrap: nowrap;
      justify-content: center; align-items: center;
      gap: 1.2rem;
    }
    #loading-controls li {
      display: inline-flex; align-items: center; gap: 0.45rem;
      white-space: nowrap;
    }
    #loading-controls kbd {
      font-family: -apple-system, BlinkMacSystemFont, monospace;
      font-size: 0.65rem; color: var(--text-muted);
      padding: 0.2rem 0.5rem; border-radius: 3px;
      background: var(--bg-tag);
      border: 1px solid var(--border-input);
      letter-spacing: 0.08em;
    }
    #loading-controls span {
      color: var(--text-faint); font-size: 0.72rem;
    }

    /* Crosshair */
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 20px; height: 20px; z-index: 10; pointer-events: none; display: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.5);
    }
    #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
    #crosshair::after { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }
    #crosshair.visible { display: block; }

    /* HUD */
    #hud {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.5); font-size: 0.75rem; letter-spacing: 0.1em;
      text-align: center; z-index: 10; pointer-events: none; display: none;
      transition: opacity 0.5s ease;
    }
    #hud.visible { display: block; }

    /* Tour controls — group of tour buttons */
    #tour-controls {
      position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 16;
      display: flex; gap: 0.5rem;
    }
    #tour-controls.hidden { display: none; }
    #tour-btn, #fav-tour-btn {
      padding: 0.6rem 1.2rem; background: rgba(0,0,0,0.65); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      font-size: 0.85rem; cursor: pointer; backdrop-filter: blur(8px);
      letter-spacing: 0.05em; transition: all 0.2s;
    }
    #tour-btn:hover, #fav-tour-btn:hover { background: rgba(0,0,0,0.85); border-color: rgba(255,255,255,0.4); }
    #tour-btn.hidden, #fav-tour-btn.hidden { display: none; }
    #fav-tour-btn { color: #ffd166; border-color: rgba(255,209,102,0.35); }
    #fav-tour-btn:hover { border-color: rgba(255,209,102,0.65); }
    #tour-status {
      position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 16;
      padding: 0.6rem 1.2rem; background: rgba(0,0,0,0.75); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      font-size: 0.8rem; backdrop-filter: blur(8px); letter-spacing: 0.05em;
    }
    #tour-status.hidden { display: none; }
    #tour-status #tour-stop {
      margin-left: 0.5rem; padding: 0.2rem 0.6rem;
      background: transparent; color: #ff8a8a; border: 1px solid #a44;
      border-radius: 3px; cursor: pointer; font-size: 0.75rem;
    }
    #tour-status #tour-stop:hover { background: rgba(170,68,68,0.2); }

    /* Sound toggle button */
    #sound-btn {
      position: fixed; top: 1.5rem; right: 1.5rem; z-index: 16;
      width: 38px; height: 38px; padding: 0;
      background: rgba(0,0,0,0.65); color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      cursor: pointer; backdrop-filter: blur(8px);
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    #sound-btn:hover { background: rgba(0,0,0,0.85); border-color: rgba(255,255,255,0.4); color: #fff; }
    #sound-btn.hidden { display: none; }
    #sound-btn svg { width: 18px; height: 18px; display: block; }

    /* Guestbook button (further left in the overlay button row) */
    #guestbook-btn {
      position: fixed; top: 1.5rem; right: 6.5rem; z-index: 16;
      width: 38px; height: 38px; padding: 0;
      background: rgba(0,0,0,0.65); color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      cursor: pointer; backdrop-filter: blur(8px);
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    #guestbook-btn:hover { background: rgba(0,0,0,0.85); border-color: rgba(255,255,255,0.4); color: #fff; }
    #guestbook-btn.hidden { display: none; }
    #guestbook-btn svg { width: 18px; height: 18px; display: block; }
    #guestbook-btn .gb-badge {
      position: absolute; top: -4px; right: -4px;
      min-width: 16px; height: 16px; padding: 0 4px;
      background: #ffd166; color: #000;
      font-size: 0.6rem; font-weight: 600;
      border-radius: 8px; line-height: 16px; text-align: center;
    }
    /* First-visit hint pulse — golden ring expands and fades around the button */
    @keyframes gbBtnPulse {
      0%   { box-shadow: 0 0 0 0 rgba(255,209,102,0.7); }
      70%  { box-shadow: 0 0 0 12px rgba(255,209,102,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,209,102,0); }
    }
    #guestbook-btn.pulse {
      animation: gbBtnPulse 1.6s ease-out 0s 3;
      border-color: rgba(255,209,102,0.55);
    }
    @media (prefers-reduced-motion: reduce) {
      #guestbook-btn.pulse { animation: none; }
    }

    /* Guestbook modal */
    #guestbook {
      position: fixed; inset: 0; z-index: 88;
      display: none; align-items: center; justify-content: center;
    }
    #guestbook.visible { display: flex; }
    #guestbook .gb-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    }
    #guestbook .gb-card {
      position: relative; width: 92%; max-width: 460px;
      max-height: 86vh; display: flex; flex-direction: column;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      color: var(--text);
      padding: 1.6rem 1.6rem 1.2rem;
    }
    #guestbook .gb-close {
      position: absolute; top: 0.6rem; right: 0.8rem;
      width: 32px; height: 32px;
      background: transparent; border: none; color: var(--text-faint);
      font-size: 1.4rem; cursor: pointer;
    }
    #guestbook .gb-close:hover { color: var(--text); }
    #guestbook .gb-header {
      display: flex; align-items: baseline; gap: 0.5rem;
      margin-bottom: 1rem;
    }
    #guestbook .gb-title {
      font-size: 0.9rem; font-weight: 300; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--text-muted);
    }
    #guestbook .gb-count {
      font-size: 0.7rem; color: var(--text-faint);
      letter-spacing: 0.1em;
    }
    #guestbook .gb-filters {
      display: flex; gap: 0.4rem; margin-bottom: 0.7rem;
    }
    #guestbook .gb-search, #guestbook .gb-sort {
      padding: 0.45rem 0.7rem;
      background: var(--bg-input); color: var(--text);
      border: 1px solid var(--border-input); border-radius: 3px;
      font-family: inherit; font-size: 0.8rem; outline: none;
    }
    #guestbook .gb-search { flex: 1; }
    #guestbook .gb-sort { cursor: pointer; }
    #guestbook .gb-liked-only {
      padding: 0.45rem 0.7rem;
      background: var(--bg-input); color: var(--text-faint);
      border: 1px solid var(--border-input); border-radius: 3px;
      font-family: inherit; font-size: 0.9rem; line-height: 1;
      cursor: pointer; transition: all 0.15s;
    }
    #guestbook .gb-liked-only:hover { border-color: var(--border-strong); color: var(--text); }
    #guestbook .gb-liked-only.active {
      color: #ff5e7a; border-color: rgba(255,94,122,0.5);
      background: rgba(255,94,122,0.08);
    }
    #guestbook .gb-search:focus, #guestbook .gb-sort:focus, #guestbook .gb-liked-only:focus { border-color: var(--border-input-focus); outline: none; }
    #guestbook .gb-search::placeholder { color: var(--text-faint); }
    #guestbook .gb-list {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.6rem;
      padding-right: 0.3rem; margin-bottom: 1rem;
      min-height: 100px; max-height: 40vh;
    }
    #guestbook .gb-empty {
      font-size: 0.78rem; color: var(--text-faint);
      text-align: center; padding: 2rem 1rem;
      border: 1px dashed var(--border); border-radius: 3px;
    }
    #guestbook .gb-entry {
      position: relative;
      padding: 0.7rem 0.9rem;
      background: var(--bg-tag); border-radius: 4px;
    }
    /* Newly posted entry — brief glow + slide-down emphasis */
    @keyframes gbEntryNew {
      0%   { background: rgba(255,209,102,0.35); transform: translateY(-6px); opacity: 0; }
      30%  { background: rgba(255,209,102,0.35); transform: translateY(0); opacity: 1; }
      100% { background: var(--bg-tag); transform: translateY(0); opacity: 1; }
    }
    #guestbook .gb-entry.gb-entry-new {
      animation: gbEntryNew 1.6s ease-out;
    }
    @media (prefers-reduced-motion: reduce) {
      #guestbook .gb-entry.gb-entry-new { animation: none; }
    }
    #guestbook .gb-entry-head {
      display: flex; align-items: baseline; gap: 0.5rem;
      margin-bottom: 0.3rem;
    }
    #guestbook .gb-entry-name {
      font-size: 0.78rem; font-weight: 500; color: var(--text);
    }
    #guestbook .gb-entry-time {
      font-size: 0.65rem; color: var(--text-faint);
      letter-spacing: 0.05em;
    }
    #guestbook .gb-entry-body {
      font-size: 0.82rem; line-height: 1.55; color: var(--text-muted);
      white-space: pre-line; word-break: break-word;
    }
    #guestbook .gb-entry-remove {
      position: absolute; top: 0.4rem; right: 0.4rem;
      width: 22px; height: 22px;
      background: transparent; border: none; cursor: pointer;
      color: var(--text-very-faint); font-size: 1rem; line-height: 1;
      opacity: 0; transition: opacity 0.15s, color 0.15s;
    }
    #guestbook .gb-entry:hover .gb-entry-remove { opacity: 1; }
    #guestbook .gb-entry-remove:hover { color: #ff8a8a; }
    #guestbook .gb-entry-footer {
      display: flex; align-items: center; margin-top: 0.45rem;
    }
    #guestbook .gb-like {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.22rem 0.5rem;
      background: transparent; border: 1px solid var(--border-input);
      border-radius: 999px; cursor: pointer;
      color: var(--text-faint); font-family: inherit; font-size: 0.72rem;
      transition: all 0.15s;
    }
    #guestbook .gb-like:hover { border-color: var(--border-strong); color: var(--text); }
    #guestbook .gb-like.liked {
      color: #ff5e7a; border-color: rgba(255,94,122,0.4);
      background: rgba(255,94,122,0.08);
    }
    #guestbook .gb-like.liked svg { fill: #ff5e7a; }
    #guestbook .gb-like-count:empty { display: none; }
    /* tiny pop animation on like toggle */
    @keyframes gbLikePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    #guestbook .gb-like.liked svg { animation: gbLikePop 0.25s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      #guestbook .gb-like.liked svg { animation: none; }
    }
    #guestbook .gb-more {
      align-self: center; margin-top: 0.3rem;
      padding: 0.45rem 1rem;
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border-input); border-radius: 3px;
      font-family: inherit; font-size: 0.75rem;
      letter-spacing: 0.05em; cursor: pointer;
      transition: all 0.15s;
    }
    #guestbook .gb-more:hover {
      border-color: var(--border-strong); color: var(--text);
      background: var(--bg-tag);
    }
    #guestbook .gb-form {
      display: flex; flex-direction: column; gap: 0.5rem;
      padding-top: 1rem; border-top: 1px solid var(--border);
    }
    #guestbook .gb-form input, #guestbook .gb-form textarea {
      width: 100%; padding: 0.55rem 0.7rem;
      background: var(--bg-input); color: var(--text);
      border: 1px solid var(--border-input); border-radius: 3px;
      font-family: inherit; font-size: 0.85rem; outline: none;
      resize: vertical;
    }
    #guestbook .gb-form input:focus, #guestbook .gb-form textarea:focus {
      border-color: var(--border-input-focus);
    }
    #guestbook .gb-form input::placeholder, #guestbook .gb-form textarea::placeholder {
      color: var(--text-faint);
    }
    #guestbook .gb-submit {
      align-self: flex-end; padding: 0.55rem 1.2rem;
      background: var(--text); color: var(--bg);
      border: none; border-radius: 3px; cursor: pointer;
      font-size: 0.78rem; font-family: inherit;
      letter-spacing: 0.1em; transition: opacity 0.15s;
    }
    #guestbook .gb-submit:hover { opacity: 0.85; }
    #guestbook .gb-submit:disabled { opacity: 0.4; cursor: default; }

    /* Screenshot button (left of sound button) */
    #screenshot-btn {
      position: fixed; top: 1.5rem; right: 4rem; z-index: 16;
      width: 38px; height: 38px; padding: 0;
      background: rgba(0,0,0,0.65); color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      cursor: pointer; backdrop-filter: blur(8px);
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    #screenshot-btn:hover { background: rgba(0,0,0,0.85); border-color: rgba(255,255,255,0.4); color: #fff; }
    #screenshot-btn.hidden { display: none; }
    #screenshot-btn svg { width: 18px; height: 18px; display: block; }

    /* Shortcut help overlay */
    #shortcut-help {
      position: fixed; inset: 0; z-index: 85;
      display: none; align-items: center; justify-content: center;
    }
    #shortcut-help.visible { display: flex; }
    #shortcut-help .sh-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    }
    #shortcut-help .sh-card {
      position: relative; padding: 2rem 2.2rem 1.6rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
      width: 90%; max-width: 380px; color: var(--text);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    #shortcut-help .sh-close {
      position: absolute; top: 0.6rem; right: 0.8rem;
      width: 28px; height: 28px;
      background: transparent; border: none;
      color: var(--text-faint); font-size: 1.4rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #shortcut-help .sh-close:hover { color: var(--text); }
    #shortcut-help .sh-title {
      font-size: 0.85rem; font-weight: 300; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 1.4rem; text-align: center;
    }
    #shortcut-help .sh-list { list-style: none; padding: 0; margin: 0; }
    #shortcut-help .sh-list li {
      display: flex; align-items: center;
      padding: 0.55rem 0; border-bottom: 1px solid var(--divider);
    }
    #shortcut-help .sh-list li:last-child { border-bottom: none; }
    #shortcut-help .sh-list kbd {
      flex-shrink: 0; min-width: 110px;
      font-family: -apple-system, BlinkMacSystemFont, monospace;
      font-size: 0.72rem; color: var(--kbd-text);
      padding: 0.28rem 0.6rem; border-radius: 3px;
      background: var(--kbd-bg); border: 1px solid var(--kbd-border);
      text-align: center; margin-right: 1rem;
      letter-spacing: 0.08em;
    }
    #shortcut-help .sh-list span {
      color: var(--text); font-size: 0.85rem; flex: 1;
    }
    #shortcut-help .sh-replay {
      width: 100%; margin-top: 1.2rem; padding: 0.6rem;
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border-input); border-radius: 3px;
      font-family: inherit; font-size: 0.78rem; cursor: pointer;
      transition: all 0.15s;
    }
    #shortcut-help .sh-replay:hover {
      border-color: var(--border-strong); color: var(--text);
      background: var(--bg-tag);
    }

    /* Welcome guide — bottom-center stepped toast for first-time visitors */
    #welcome-guide {
      position: fixed; left: 50%; bottom: 6.5rem; transform: translateX(-50%);
      z-index: 75; display: none; pointer-events: none;
    }
    #welcome-guide.visible { display: block; }
    #welcome-guide .wg-card {
      position: relative; pointer-events: auto;
      width: 92vw; max-width: 380px;
      padding: 1.1rem 1.2rem 1rem;
      background: rgba(20,20,20,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; color: #fff;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    [data-theme="light"] #welcome-guide .wg-card {
      background: rgba(255,255,255,0.96); color: #222;
      border-color: rgba(0,0,0,0.12);
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }
    #welcome-guide .wg-close {
      position: absolute; top: 0.3rem; right: 0.5rem;
      width: 28px; height: 28px;
      background: transparent; border: none;
      color: var(--text-faint); font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #welcome-guide .wg-close:hover { color: var(--text); }
    #welcome-guide .wg-step {
      font-size: 0.62rem; color: var(--text-faint);
      letter-spacing: 0.2em; text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    #welcome-guide .wg-title {
      font-size: 1.05rem; font-weight: 500; margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
    }
    [data-theme="light"] #welcome-guide .wg-title { color: #111; }
    #welcome-guide .wg-body {
      font-size: 0.82rem; line-height: 1.55; color: var(--text-muted);
      font-weight: 300; margin-bottom: 0.9rem;
    }
    [data-theme="light"] #welcome-guide .wg-body { color: #444; }
    #welcome-guide .wg-dots {
      display: flex; gap: 0.35rem; justify-content: center;
      margin-bottom: 0.9rem;
    }
    #welcome-guide .wg-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transition: background 0.2s, transform 0.2s;
    }
    [data-theme="light"] #welcome-guide .wg-dot { background: rgba(0,0,0,0.15); }
    #welcome-guide .wg-dot.active {
      background: rgba(255,255,255,0.85); transform: scale(1.2);
    }
    [data-theme="light"] #welcome-guide .wg-dot.active { background: rgba(0,0,0,0.8); }
    #welcome-guide .wg-actions {
      display: flex; gap: 0.5rem; justify-content: flex-end;
    }
    #welcome-guide .wg-skip, #welcome-guide .wg-next {
      padding: 0.45rem 0.95rem;
      background: transparent; color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 3px;
      font-family: inherit; font-size: 0.78rem; cursor: pointer;
      transition: all 0.15s;
    }
    [data-theme="light"] #welcome-guide .wg-skip,
    [data-theme="light"] #welcome-guide .wg-next {
      border-color: rgba(0,0,0,0.2);
    }
    #welcome-guide .wg-skip:hover, #welcome-guide .wg-next:hover {
      border-color: rgba(255,255,255,0.4); color: #fff;
    }
    [data-theme="light"] #welcome-guide .wg-skip:hover,
    [data-theme="light"] #welcome-guide .wg-next:hover {
      border-color: rgba(0,0,0,0.45); color: #000;
    }
    #welcome-guide .wg-next {
      background: rgba(255,255,255,0.95); color: #000; border-color: transparent;
    }
    [data-theme="light"] #welcome-guide .wg-next {
      background: #222; color: #fff;
    }
    #welcome-guide .wg-next:hover {
      background: #fff; color: #000;
    }
    [data-theme="light"] #welcome-guide .wg-next:hover {
      background: #000;
    }

    /* Cinematic entry fade — black overlay that fades to transparent on gallery entry */
    #scene-fade {
      position: fixed; inset: 0; z-index: 70;
      background: #000; pointer-events: none;
      opacity: 0;
    }
    /* .cover: instant black, no transition */
    #scene-fade.cover { opacity: 1; transition: none; }
    /* .reveal added on next frame so the transition kicks in (1 → 0) */
    #scene-fade.reveal { opacity: 0; transition: opacity 1.4s ease-out; }

    /* Screenshot flash overlay */
    #screenshot-flash {
      position: fixed; inset: 0; z-index: 95;
      background: #fff; opacity: 0; pointer-events: none;
    }
    #screenshot-flash.flash { animation: flashFade 0.32s ease-out; }
    @keyframes flashFade {
      0% { opacity: 0; }
      15% { opacity: 0.75; }
      100% { opacity: 0; }
    }

    /* Artwork Info Panel */
    #artwork-panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: 380px;
      background: var(--panel-bg, rgba(0,0,0,0.92)); color: var(--text); z-index: 20;
      padding: 3rem 2rem; transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
      overflow-y: auto; backdrop-filter: blur(20px);
    }
    #artwork-panel.visible { transform: translateX(0); }
    [data-theme="light"] { --panel-bg: rgba(255,255,255,0.96); }
    [data-theme="dark"] { --panel-bg: rgba(0,0,0,0.92); }
    #artwork-panel .close-btn {
      position: absolute; top: 1rem; right: 1rem;
      background: none; border: none; color: var(--text-faint); font-size: 1.5rem; cursor: pointer;
      transition: color 0.2s;
    }
    #artwork-panel .close-btn:hover { color: var(--text); }
    #artwork-panel .fav-btn {
      position: absolute; top: 1rem; right: 3.2rem;
      width: 32px; height: 32px; padding: 0;
      background: transparent; border: 1px solid transparent; border-radius: 4px;
      color: #888; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    #artwork-panel .fav-btn:hover { color: #fff; border-color: #3a3a3a; background: rgba(255,255,255,0.04); }
    #artwork-panel .fav-btn.starred { color: #ffd166; }
    #artwork-panel .fav-btn.starred:hover { color: #ffe69b; }
    #artwork-panel .fav-btn svg { width: 18px; height: 18px; display: block; }
    #artwork-panel .art-image-wrap {
      margin: 1.5rem 0 1rem; background: #0a0a0a; border-radius: 3px;
      overflow: hidden; cursor: zoom-in;
      display: none; align-items: center; justify-content: center;
      max-height: 280px;
    }
    #artwork-panel .art-image-wrap.visible { display: flex; }
    #artwork-panel .art-image-wrap img {
      max-width: 100%; max-height: 280px; display: block;
      transition: transform 0.2s ease;
    }
    #artwork-panel .art-image-wrap:hover img { transform: scale(1.02); }

    /* Fullscreen zoom view */
    #image-zoom {
      position: fixed; inset: 0; z-index: 90;
      background: rgba(0,0,0,0.94); backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center;
      cursor: grab; overflow: hidden;
    }
    #image-zoom.visible { display: flex; }
    #image-zoom.dragging { cursor: grabbing; }
    #image-zoom img {
      max-width: 95vw; max-height: 95vh;
      transform-origin: center center;
      will-change: transform;
      user-select: none; -webkit-user-drag: none;
      transition: transform 0.05s linear;
    }
    #image-zoom .zoom-close {
      position: fixed; top: 1.2rem; right: 1.2rem;
      width: 36px; height: 36px;
      background: rgba(0,0,0,0.5); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
      font-size: 1.3rem; cursor: pointer; z-index: 91;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
    }
    #image-zoom .zoom-close:hover { background: rgba(0,0,0,0.85); border-color: rgba(255,255,255,0.4); }
    #image-zoom .zoom-hint {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      font-size: 0.72rem; color: #666; letter-spacing: 0.1em;
      pointer-events: none; z-index: 91;
    }
    #artwork-panel .art-nav {
      position: absolute; top: 1rem; left: 1rem;
      display: flex; gap: 0.3rem;
    }
    #artwork-panel .nav-btn {
      width: 28px; height: 28px; padding: 0;
      background: transparent; border: 1px solid #3a3a3a; border-radius: 3px;
      color: #aaa; font-size: 1.1rem; line-height: 1; cursor: pointer;
      transition: all 0.2s;
    }
    #artwork-panel .nav-btn:hover { border-color: #888; color: #fff; background: rgba(255,255,255,0.05); }
    #artwork-panel .art-title { margin-top: 1.5rem; }
    #artwork-panel .art-title { font-size: 1.5rem; font-weight: 300; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
    #artwork-panel .art-artist { font-size: 1rem; color: var(--text-muted); margin-bottom: 0.3rem; }
    #artwork-panel .art-year { font-size: 0.85rem; color: var(--text-faint); margin-bottom: 1.5rem; }
    #artwork-panel .art-divider { width: 40px; height: 1px; background: var(--border-strong); margin-bottom: 1.5rem; }
    #artwork-panel .art-desc { font-size: 0.9rem; line-height: 1.7; color: var(--text); font-weight: 300; }
    #artwork-panel .art-curator-note {
      display: none; margin: 1.2rem 0 1.5rem; padding: 0.9rem 1rem;
      background: var(--bg-tag); border-left: 2px solid #ffd166;
      border-radius: 3px;
      font-size: 0.85rem; line-height: 1.65; color: var(--text);
      white-space: pre-line; font-weight: 300;
    }
    #artwork-panel .art-curator-note.has-content { display: block; }
    #artwork-panel .art-curator-note::before {
      content: attr(data-label);
      display: block; font-size: 0.66rem; color: #ffd166;
      letter-spacing: 0.2em; text-transform: uppercase;
      margin-bottom: 0.5rem; font-weight: 400;
    }
    #artwork-panel .art-category { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.8rem; }
    #artwork-panel .art-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.2rem; }
    #artwork-panel .art-tag { font-size: 0.75rem; color: var(--text-muted); background: var(--bg-tag); padding: 0.25rem 0.6rem; border-radius: 12px; }
    #artwork-panel .art-stats { font-size: 0.8rem; color: var(--text-faint); margin-top: 1.2rem; }
    #artwork-panel .art-loading { font-size: 0.85rem; color: var(--text-faint); }
    #artwork-panel .art-link {
      display: inline-block; margin-top: 1rem; padding: 0.5rem 0.9rem;
      font-size: 0.8rem; color: var(--text-muted); text-decoration: none;
      border: 1px solid var(--border-input); border-radius: 3px;
      transition: all 0.2s ease;
    }
    #artwork-panel .art-link:hover { border-color: var(--border-strong); color: var(--text); background: var(--bg-tag); }
    #artwork-panel .art-body {
      font-size: 0.85rem; line-height: 1.7; color: var(--text-muted); font-weight: 300;
      margin-top: 1.5rem; padding-top: 1.2rem; border-top: 1px solid var(--border-input);
      word-break: break-word;
    }
    #artwork-panel .art-body p { margin: 0 0 0.8rem 0; }
    #artwork-panel .art-body strong { color: var(--text); font-weight: 500; }
    #artwork-panel .art-body img { display: block; max-width: 100%; height: auto; margin: 0.8rem 0; border-radius: 3px; }
    #artwork-panel .art-body a { color: #8ab4f8; text-decoration: none; }
    #artwork-panel .art-body a:hover { text-decoration: underline; }

    /* Exhibition Picker */
    #exhibition-picker {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center;
      background: var(--bg); color: var(--text);
      padding: 4rem 2rem; overflow-y: auto;
    }
    #exhibition-picker.hidden { display: none; }
    #picker-title {
      font-size: 1.2rem; font-weight: 300; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--picker-title); margin-bottom: 2.5rem;
    }
    .picker-toggles {
      position: absolute; top: 1.5rem; right: 1.5rem;
      display: flex; gap: 0.4rem;
    }
    .lang-toggle, .theme-toggle {
      padding: 0.4rem 0.9rem;
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 3px;
      font-family: inherit; font-size: 0.7rem; letter-spacing: 0.15em;
      cursor: pointer; transition: all 0.2s ease;
      display: inline-flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .lang-toggle:hover, .theme-toggle:hover {
      border-color: var(--border-strong); color: var(--text);
      background: var(--bg-tag);
    }
    .theme-toggle { padding: 0.4rem 0.55rem; min-width: 2.2rem; }
    .theme-toggle svg { width: 14px; height: 14px; display: block; }
    .picker-container { width: 100%; max-width: 800px; }
    .picker-section { margin-bottom: 3rem; }
    .picker-section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border);
    }
    .picker-section-header h2 {
      font-size: 0.85rem; font-weight: 400; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--text-muted);
    }
    .picker-btn {
      display: inline-flex; align-items: center;
      font-family: inherit; font-size: 0.75rem; line-height: 1;
      color: var(--text-muted); background: transparent;
      border: 1px solid var(--border-input); padding: 0.5rem 0.9rem; cursor: pointer;
      text-decoration: none; letter-spacing: 0.05em; border-radius: 3px;
      transition: all 0.2s ease;
    }
    .picker-btn:hover { border-color: var(--border-strong); color: var(--text); background: var(--bg-tag); }
    .picker-btn-group { display: inline-flex; gap: 0.5rem; }
    .filter-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .filter-input, .filter-select {
      padding: 0.5rem 0.8rem; background: var(--bg-input); border: 1px solid var(--border-input); border-radius: 3px;
      color: var(--text); font-size: 0.8rem; outline: none;
    }
    .filter-input { flex: 1; }
    .filter-input:focus, .filter-select:focus { border-color: var(--border-input-focus); }
    .filter-input::placeholder { color: var(--text-faint); }
    .filter-select { cursor: pointer; }
    .picker-list { display: flex; flex-direction: column; gap: 0.8rem; }
    .picker-empty { font-size: 0.8rem; color: var(--text-faint); padding: 1rem; text-align: center; border: 1px dashed var(--border); border-radius: 3px; }
    /* Card entry animation — staggered fade-up. `backwards` fill so hover transforms still work after entry. */
    @keyframes cardFadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .template-card, .exhibition-card {
      animation: cardFadeUp 0.42s ease-out backwards;
    }
    .template-card:nth-child(1), .exhibition-card:nth-child(1) { animation-delay: 0ms; }
    .template-card:nth-child(2), .exhibition-card:nth-child(2) { animation-delay: 50ms; }
    .template-card:nth-child(3), .exhibition-card:nth-child(3) { animation-delay: 100ms; }
    .template-card:nth-child(4), .exhibition-card:nth-child(4) { animation-delay: 150ms; }
    .template-card:nth-child(5), .exhibition-card:nth-child(5) { animation-delay: 200ms; }
    .template-card:nth-child(6), .exhibition-card:nth-child(6) { animation-delay: 250ms; }
    .template-card:nth-child(7), .exhibition-card:nth-child(7) { animation-delay: 290ms; }
    .template-card:nth-child(8), .exhibition-card:nth-child(8) { animation-delay: 320ms; }
    .template-card:nth-child(n+9), .exhibition-card:nth-child(n+9) { animation-delay: 350ms; }
    @media (prefers-reduced-motion: reduce) {
      .template-card, .exhibition-card { animation: none; }
    }

    /* Template tabs */
    .template-tabs {
      display: flex; align-items: center; gap: 0; margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .template-tab {
      padding: 0.6rem 1.2rem; font-size: 0.8rem; color: var(--text-faint);
      background: transparent; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; transition: all 0.2s ease; letter-spacing: 0.05em;
    }
    .template-tab:hover { color: var(--text-muted); }
    .template-tab.active { color: var(--text); border-bottom-color: var(--text); }
    .template-tab .tab-count {
      font-size: 0.65rem; color: var(--text-very-faint); margin-left: 0.3rem;
    }
    .template-tab.active .tab-count { color: var(--text-faint); }
    .template-tabs .tab-spacer { flex: 1; }
    /* Template grid layout */
    .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1rem; }
    .template-pagination {
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      margin-top: 1.2rem;
    }
    .template-pagination button {
      min-width: 32px; height: 32px; padding: 0 0.6rem;
      background: transparent; border: 1px solid var(--border-input); border-radius: 3px;
      color: var(--text-faint); font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease;
    }
    .template-pagination button:hover { border-color: var(--border-strong); color: var(--text); }
    .template-pagination button.active { border-color: var(--text-faint); color: var(--text); background: var(--bg-tag); }
    .template-pagination button:disabled { opacity: 0.3; cursor: default; }
    .template-pagination button:disabled:hover { border-color: var(--border-input); color: var(--text-faint); }
    .template-card {
      display: flex; flex-direction: column;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px;
      cursor: pointer; transition: all 0.25s ease; overflow: hidden;
    }
    .template-card:hover { border-color: var(--border-strong); background: var(--bg-card-hover); transform: translateY(-2px); }
    .template-card .template-preview {
      width: 100%; height: 140px; display: block; background: var(--divider);
    }
    .template-card .card-body { padding: 0.9rem 1rem; }
    .template-card h3 { font-weight: 500; font-size: 0.9rem; margin-bottom: 0.3rem; color: var(--text); }
    .template-card p { font-size: 0.7rem; color: var(--text-faint); line-height: 1.4; margin-bottom: 0.3rem; }
    .template-card .card-meta { font-size: 0.65rem; color: var(--text-very-faint); }
    /* Exhibition list cards (내 전시회) */
    .exhibition-card {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 1.4rem 1rem 1rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 3px;
      transition: all 0.25s ease;
    }
    .exhibition-card:hover { border-color: var(--border-strong); background: var(--bg-card-hover); }
    .exhibition-card .card-thumb {
      flex-shrink: 0; width: 84px; height: 64px;
      background: var(--divider); border-radius: 3px; overflow: hidden;
      display: block; cursor: pointer;
    }
    .exhibition-card .card-thumb img,
    .exhibition-card .card-thumb canvas {
      width: 100%; height: 100%; display: block; object-fit: cover;
    }
    .exhibition-card .card-main { flex: 1; min-width: 0; cursor: pointer; }
    .exhibition-card h3 {
      font-weight: 400; font-size: 1rem; margin-bottom: 0.25rem; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .exhibition-card p {
      font-size: 0.75rem; color: var(--text-faint);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .exhibition-card .card-meta { font-size: 0.7rem; color: var(--text-very-faint); margin-top: 0.3rem; }
    .exhibition-card .card-stats {
      display: flex; flex-wrap: wrap; gap: 0.35rem;
      margin-top: 0.4rem;
    }
    .exhibition-card .card-stat {
      display: inline-flex; align-items: center;
      padding: 0.18rem 0.5rem;
      background: var(--bg-tag); color: var(--text-faint);
      font-size: 0.68rem; letter-spacing: 0.04em;
      border-radius: 999px;
      line-height: 1.4;
    }
    .exhibition-card .card-stat-fav { color: #ffd166; }
    .exhibition-card .card-stat-like { color: #ff5e7a; }
    .exhibition-card .card-stat-gb { color: var(--text-muted); }
    .exhibition-card .card-guestbook {
      font-size: 0.72rem; color: var(--text-muted); margin-top: 0.35rem;
      font-style: italic; font-weight: 300;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .exhibition-card .card-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .exhibition-card .card-btn {
      font-size: 0.7rem; color: var(--text-muted); background: transparent;
      border: 1px solid var(--border-input); padding: 0.35rem 0.7rem; cursor: pointer;
      transition: all 0.2s ease; text-decoration: none; white-space: nowrap;
    }
    .exhibition-card .card-btn:hover { border-color: var(--border-strong); color: var(--text); }
    .exhibition-card .card-btn.danger:hover { border-color: #a44; color: #ff8a8a; }

    /* QR Code Modal */
    #qr-modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; }
    #qr-modal.visible { display: flex; }
    #qr-modal .qr-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); }
    #qr-modal .qr-content {
      position: relative; padding: 2rem; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; max-width: 360px; text-align: center; color: var(--text);
    }
    #qr-modal .qr-close {
      position: absolute; top: 0.5rem; right: 0.8rem; background: none; border: none;
      color: var(--text-faint); font-size: 1.5rem; cursor: pointer;
    }
    #qr-modal .qr-close:hover { color: var(--text); }
    #qr-modal .qr-title { font-size: 1rem; font-weight: 400; margin-bottom: 1rem; color: var(--text); }
    #qr-modal .qr-canvas { display: block; margin: 0 auto 1rem; border-radius: 4px; }
    #qr-modal .qr-url {
      font-size: 0.7rem; color: var(--text-faint); word-break: break-all;
      padding: 0.5rem; background: var(--bg); border-radius: 3px; margin-bottom: 0.6rem;
    }
    #qr-modal .qr-hint { font-size: 0.75rem; color: var(--text-faint); }

    /* Minimap */
    #minimap {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 15;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 4px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      pointer-events: auto; display: none; cursor: crosshair;
      transition: border-color 0.15s;
      /* no CSS transform — X flip handled in draw code */
    }
    #minimap.visible { display: block; }
    #minimap:hover { border-color: rgba(255,255,255,0.35); }

    @media (max-width: 768px) {
      /* Artwork panel — mobile-optimized: full sheet, larger tap targets, safe-area */
      #artwork-panel {
        width: 100%; padding: 3.2rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));
      }
      #artwork-panel .close-btn {
        width: 44px; height: 44px; top: 0.4rem; right: 0.4rem;
        display: flex; align-items: center; justify-content: center;
      }
      #artwork-panel .fav-btn {
        width: 44px; height: 44px; top: 0.4rem; right: 3.3rem;
      }
      #artwork-panel .fav-btn svg { width: 20px; height: 20px; }
      #artwork-panel .art-nav {
        top: 0.6rem; left: 0.5rem; gap: 0.3rem;
      }
      #artwork-panel .nav-btn { width: 38px; height: 38px; font-size: 1.3rem; }
      #artwork-panel .art-title { margin-top: 1.2rem; font-size: 1.25rem; }
      #artwork-panel .art-artist { font-size: 0.92rem; margin-bottom: 0.25rem; }
      #artwork-panel .art-year { font-size: 0.78rem; margin-bottom: 1rem; }
      #artwork-panel .art-image-wrap { margin: 1rem 0 0.8rem; max-height: 200px; }
      #artwork-panel .art-image-wrap img { max-height: 200px; }
      #artwork-panel .art-divider { margin-bottom: 1rem; }
      #artwork-panel .art-desc { font-size: 0.85rem; }
      #artwork-panel .art-category { font-size: 0.75rem; margin-bottom: 0.6rem; }
      #artwork-panel .art-tag { font-size: 0.7rem; padding: 0.22rem 0.55rem; }
      #artwork-panel .art-stats { font-size: 0.75rem; }
      #artwork-panel .art-link { padding: 0.55rem 0.9rem; font-size: 0.78rem; }
      #artwork-panel .art-body { font-size: 0.8rem; line-height: 1.65; }
      #artwork-panel .art-curator-note { padding: 0.75rem 0.85rem; font-size: 0.8rem; }
      #artwork-panel .art-curator-note::before { font-size: 0.62rem; margin-bottom: 0.35rem; }
      #loading-title { font-size: 1.3rem; }
      #minimap { bottom: 0.8rem; right: 0.8rem; }
      #exhibition-picker { padding: 2rem 1rem; }
      #picker-title { font-size: 1rem; margin-bottom: 1.5rem; }
      .template-grid { grid-template-columns: 1fr 1fr; gap: 0.6rem; }
      .template-card .template-preview { height: 100px; }
      .template-card .card-body { padding: 0.6rem 0.7rem; }
      .template-card h3 { font-size: 0.8rem; }
      .template-card p { font-size: 0.65rem; }
      .exhibition-card { flex-wrap: wrap; padding: 0.8rem; gap: 0.7rem; }
      .exhibition-card .card-thumb { width: 64px; height: 48px; }
      .exhibition-card .card-actions { width: 100%; margin-top: 0.4rem; }
      #tour-btn, #fav-tour-btn, #tour-status { font-size: 0.75rem; padding: 0.7rem 1rem; }
      #tour-controls { gap: 0.35rem; }
      #sound-btn { top: 0.8rem; right: 0.8rem; width: 34px; height: 34px; font-size: 0.9rem; }
      #screenshot-btn { top: 0.8rem; right: 3.2rem; width: 34px; height: 34px; }
      #guestbook-btn { top: 0.8rem; right: 5.6rem; width: 34px; height: 34px; }
      #guestbook .gb-card { max-width: 96vw; padding: 1.2rem 1.1rem 1rem; max-height: 92vh; }
      #guestbook .gb-title { font-size: 0.8rem; letter-spacing: 0.25em; }
      #guestbook .gb-list { max-height: 50vh; }
      #guestbook .gb-entry { padding: 0.6rem 0.7rem; }
      #guestbook .gb-entry-name { font-size: 0.78rem; }
      #guestbook .gb-entry-body { font-size: 0.8rem; }
      #guestbook .gb-entry-remove { opacity: 1; }  /* always visible on touch (no hover) */
      #guestbook .gb-form input, #guestbook .gb-form textarea { font-size: 16px; } /* prevent iOS auto-zoom */
      #guestbook .gb-submit { width: 100%; padding: 0.7rem; }
      #shortcut-help .sh-card { padding: 1.6rem 1.4rem 1.3rem; max-width: 92vw; }
      #shortcut-help .sh-list kbd { min-width: 90px; font-size: 0.66rem; }
      #shortcut-help .sh-list span { font-size: 0.78rem; }
      #loading-controls { bottom: 1.5rem; }
      #loading-controls ul { gap: 0.9rem; }
      #loading-controls kbd { font-size: 0.6rem; padding: 0.18rem 0.4rem; }
      #loading-controls span { font-size: 0.66rem; }
      #loading-description { font-size: 0.82rem; padding: 0 1rem; max-width: 92vw; }
      #qr-modal .qr-content { max-width: 90vw; padding: 1.5rem; }
      #qr-modal .qr-canvas { max-width: 100%; height: auto !important; }
    }
    /* Extra-narrow phones */
    @media (max-width: 380px) {
      #artwork-panel { padding-left: 0.9rem; padding-right: 0.9rem; }
      #artwork-panel .art-title { font-size: 1.1rem; }
      #artwork-panel .art-image-wrap, #artwork-panel .art-image-wrap img { max-height: 170px; }
    }
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="loading-screen">
    <div id="loading-title" data-i18n="loading.title">EXHIBITION</div>
    <div id="loading-meta"></div>
    <div id="loading-bar-container"><div id="loading-bar"></div></div>
    <div id="loading-status" data-i18n="loading.preparing">준비 중...</div>
    <div id="loading-description"></div>
    <div id="loading-credits"></div>
    <button id="enter-prompt" data-i18n="loading.enter">입장하기</button>
    <div id="loading-controls"><ul></ul></div>
  </div>

  <div id="crosshair"></div>

  <div id="hud" data-i18n="hud.desktop">WASD 이동 · 마우스 시선 · 클릭 작품 감상 · T 자동 투어 · M 음소거 · ESC 나가기</div>
  <div id="tour-controls" class="hidden">
    <button id="tour-btn" data-i18n="tour.start">▶ 자동 투어 (T)</button>
    <button id="fav-tour-btn" class="hidden" data-i18n="tour.startFavorites">★ 즐겨찾기 투어</button>
  </div>
  <div id="tour-status" class="hidden"><span id="tour-progress"></span> · <button id="tour-stop" data-i18n="tour.stop">투어 종료</button></div>
  <button id="sound-btn" class="hidden" data-i18n-title="btn.sound.title" title="사운드 켜기/끄기 (M)" aria-label="사운드 토글"></button>
  <button id="screenshot-btn" class="hidden" data-i18n-title="btn.screenshot.title" title="스크린샷 (P)" aria-label="스크린샷"></button>
  <button id="guestbook-btn" class="hidden" data-i18n-title="btn.guestbook.title" title="방명록" aria-label="방명록"></button>
  <div id="screenshot-flash"></div>
  <canvas id="minimap" width="160" height="160"></canvas>

  <div id="artwork-panel">
    <button class="close-btn">&times;</button>
    <button class="fav-btn" data-i18n-title="panel.fav.add" title="즐겨찾기 (F)" aria-label="즐겨찾기 토글"></button>
    <div class="art-nav">
      <button class="nav-btn nav-prev" data-i18n-title="panel.nav.prev" title="이전 작품">‹</button>
      <button class="nav-btn nav-next" data-i18n-title="panel.nav.next" title="다음 작품">›</button>
    </div>
    <h2 class="art-title"></h2>
    <p class="art-artist"></p>
    <p class="art-category"></p>
    <p class="art-year"></p>
    <div class="art-image-wrap"><img class="art-image" alt="" /></div>
    <div class="art-curator-note"></div>
    <div class="art-divider"></div>
    <p class="art-desc"></p>
    <div class="art-tags"></div>
    <p class="art-stats"></p>
    <a class="art-link" data-i18n="panel.link" target="_blank" rel="noopener noreferrer">Grafolio에서 보기 →</a>
    <div class="art-body"></div>
    <p class="art-loading"></p>
  </div>

  <div id="exhibition-picker" class="hidden">
    <div class="picker-toggles">
      <button id="theme-toggle" class="theme-toggle" data-i18n-title="btn.theme.title" aria-label="Theme"></button>
      <button id="lang-toggle" class="lang-toggle" data-i18n-title="btn.lang.title" aria-label="Language"></button>
    </div>
    <div id="picker-title" data-i18n="picker.title">전시 선택</div>
    <div class="picker-container">
      <div class="picker-section">
        <div class="template-tabs">
          <button class="template-tab active" id="tab-builtin" data-i18n="picker.tab.builtin">기본 템플릿</button>
          <button class="template-tab" id="tab-custom"><span data-i18n="picker.tab.custom">내 템플릿</span> <span class="tab-count" id="tab-custom-count"></span></button>
          <span class="tab-spacer"></span>
          <div class="picker-btn-group">
            <button class="picker-btn" id="template-import" data-i18n="picker.btn.import">가져오기</button>
            <a class="picker-btn" href="/editor/" data-i18n="picker.btn.newTemplate">새 템플릿 만들기</a>
          </div>
        </div>
        <div class="filter-bar">
          <input type="search" id="template-search" class="filter-input" data-i18n-placeholder="picker.search.placeholder" placeholder="이름으로 검색..." />
        </div>
        <div id="picker-templates" class="picker-list"></div>
      </div>
      <div class="picker-section">
        <div class="picker-section-header">
          <h2 data-i18n="picker.tab.exhibitions">내 전시회</h2>
          <div class="picker-btn-group">
            <button class="picker-btn" id="exhibition-import" data-i18n="picker.btn.import">가져오기</button>
            <a class="picker-btn" href="/editor/" data-i18n="picker.btn.newExhibition">새 전시회 만들기</a>
          </div>
        </div>
        <div class="filter-bar">
          <input type="search" id="exhibition-search" class="filter-input" data-i18n-placeholder="picker.search.placeholder" placeholder="이름으로 검색..." />
          <select id="exhibition-sort" class="filter-select">
            <option value="updated" data-i18n="picker.sort.updated">최근 수정 순</option>
            <option value="created" data-i18n="picker.sort.created">최신 생성 순</option>
            <option value="name" data-i18n="picker.sort.name">이름 순</option>
            <option value="popular" data-i18n="picker.sort.popular">인기 순</option>
          </select>
        </div>
        <div id="picker-custom" class="picker-list"></div>
      </div>
    </div>
  </div>

  <input type="file" id="import-file-input" accept="application/json,.json" style="display:none" multiple />

  <div id="scene-fade"></div>

  <div id="image-zoom">
    <button class="zoom-close" aria-label="닫기">&times;</button>
    <img alt="" />
    <div class="zoom-hint" data-i18n="zoom.hint">스크롤 확대 · 드래그 이동 · 더블클릭 초기화 · ESC 닫기</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
